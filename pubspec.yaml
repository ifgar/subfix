name: subfix
description: "Desktop application for adjusting subtitle timing."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  window_manager: ^0.5.1
  gtk_theme_fl:
    git:
      url: https://github.com/gtk-flutter/gtk_theme_fl.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - themes.conf